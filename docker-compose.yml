# Project One. Base definition: services talk to each other by name on the internal network and
# publish nothing. Add a mode on top:
#   dev : docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile dev up -d --build
#   prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Optional profiles: `dev` (mailpit, flower), `monitoring` (prometheus, alertmanager, node and
# blackbox exporters, grafana), `ops` (GlitchTip error tracking, Uptime Kuma), `mlflow`
# (experiment tracking). docs/guides/docker.md lists every file and command.

name: project-one

x-backend-env: &backend-env
  P1_ENV: ${P1_ENV:-dev}
  P1_PUBLIC_BASE_URL: ${P1_PUBLIC_BASE_URL:-http://localhost:9597}
  P1_DATABASE_URL: postgresql+asyncpg://p1_app:${P1_APP_PASSWORD:?set P1_APP_PASSWORD in .env}@postgres:5432/project_one
  P1_DATABASE_OWNER_URL: postgresql+asyncpg://p1_owner:${P1_OWNER_PASSWORD:?set P1_OWNER_PASSWORD in .env}@postgres:5432/project_one
  P1_REDIS_URL: redis://:${P1_REDIS_PASSWORD:?set P1_REDIS_PASSWORD in .env}@redis:6379/0
  P1_CELERY_BROKER_URL: redis://:${P1_REDIS_PASSWORD}@redis:6379/1
  P1_S3_ENDPOINT_URL: http://minio:9000
  P1_S3_PUBLIC_ENDPOINT_URL: ${P1_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9601}
  P1_S3_ACCESS_KEY: ${P1_S3_ACCESS_KEY:?set P1_S3_ACCESS_KEY in .env}
  P1_S3_SECRET_KEY: ${P1_S3_SECRET_KEY:?set P1_S3_SECRET_KEY in .env}
  P1_CLAMAV_HOST: clamav
  P1_CLAMAV_PORT: "3310"
  P1_FERNET_KEYS: ${P1_FERNET_KEYS:?set P1_FERNET_KEYS in .env}
  P1_JWT_SIGNING_KEYS: ${P1_JWT_SIGNING_KEYS:?set P1_JWT_SIGNING_KEYS in .env}
  P1_COOKIE_SECURE: ${P1_COOKIE_SECURE:-true}
  P1_CORS_ALLOW_ORIGINS: ${P1_CORS_ALLOW_ORIGINS:-http://localhost:9595,http://localhost:9597}
  P1_LOG_JSON: "true"
  P1_API_DOCS: ${P1_API_DOCS:-true}
  P1_SMTP_HOST: ${P1_SMTP_HOST:-}
  P1_SMTP_PORT: ${P1_SMTP_PORT:-587}
  P1_SMTP_USER: ${P1_SMTP_USER:-}
  P1_SMTP_PASSWORD: ${P1_SMTP_PASSWORD:-}
  P1_SMTP_FROM: ${P1_SMTP_FROM:-no-reply@itcraft.example}
  P1_SMTP_STARTTLS: ${P1_SMTP_STARTTLS:-true}
  P1_SENTRY_DSN: ${P1_SENTRY_DSN:-}
  P1_VAPID_PUBLIC_KEY: ${P1_VAPID_PUBLIC_KEY:-}
  P1_VAPID_PRIVATE_KEY: ${P1_VAPID_PRIVATE_KEY:-}
  P1_VAPID_SUBJECT: ${P1_VAPID_SUBJECT:-mailto:it@itcraft.net.in}
  P1_MLFLOW_TRACKING_URI: ${P1_MLFLOW_TRACKING_URI:-}
  P1_OTEL_EXPORTER_OTLP_ENDPOINT: ${P1_OTEL_EXPORTER_OTLP_ENDPOINT:-}
  P1_LIBRARY_INBOX_DIR: /data/inbox
  P1_CORPUS_ORIGINALS_RETENTION_DAYS: ${P1_CORPUS_ORIGINALS_RETENTION_DAYS:-0}

x-backend: &backend
  build:
    context: ./backend
  image: project-one/backend:${P1_VERSION:-dev}
  restart: unless-stopped
  environment: *backend-env
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  networks: [internal]

services:
  postgres:
    image: postgres:16.6-alpine@sha256:1d04b9ba1d4996401f2552b51beda8187f175c0645c091e4781134fc9c9a3eef
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${P1_POSTGRES_PASSWORD:?set P1_POSTGRES_PASSWORD in .env}
      P1_OWNER_PASSWORD: ${P1_OWNER_PASSWORD}
      P1_APP_PASSWORD: ${P1_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_one || pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: {memory: 1g}
    networks: [internal]

  redis:
    image: valkey/valkey:8.0-alpine@sha256:fd348c9b6999ef15719a1d6b43b810ee1bf2068ded2d7ab6f6dd15943841f28b
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${P1_REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${P1_REDIS_PASSWORD}
    networks: [internal]

  minio:
    # The official minio/minio images are no longer published; see docs/decisions/0006.
    image: cgr.dev/chainguard/minio@sha256:4692462f35d97d7e82c30371d82f057703c5d9489bcae726010594c812f2d285
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${P1_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${P1_S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    networks: [internal]

  clamav:
    image: clamav/clamav:1.4@sha256:57deb108fc4c72778aa83eafbca7bb7153e28c3f57c005afd38d31f16da86f23
    restart: unless-stopped
    volumes:
      - clamdata:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks: [internal]

  migrate:
    <<: *backend
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli init-storage"]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_started}

  api:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      clamav: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 1g}

  worker:
    <<: *backend
    command: ["celery", "-A", "app.worker", "worker", "-l", "info", "--concurrency", "2"]
    volumes:
      # Old BOQs and PrismSuite reports dropped here are read every 5 minutes (ADR 0014).
      - ./inbox:/data/inbox
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 1g}

  beat:
    <<: *backend
    command: ["celery", "-A", "app.worker", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      # beat writes its schedule file once it is running
      test: ["CMD-SHELL", "test -s /tmp/celerybeat-schedule || test -f /tmp/celerybeat-schedule.db"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 256m}

  web:
    build:
      context: ./frontend
      args:
        API_ORIGIN: http://api:9596
    image: project-one/web:${P1_VERSION:-dev}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      api: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 512m}
    networks: [internal]

  proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      api: {condition: service_healthy}
    networks: [internal]

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    networks: [internal]

  # Routes alerts to email and, for critical ones, to a phone through ntfy (infra/alertmanager).
  alertmanager:
    profiles: [monitoring]
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertdata:/alertmanager
    networks: [internal]

  # Disk, memory and CPU of the server, for the disk and memory alerts.
  node-exporter:
    profiles: [monitoring]
    image: prom/node-exporter:v1.8.2@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706
    restart: unless-stopped
    networks: [internal]

  # Probes the public address: up or down, and the HTTPS certificate's expiry.
  blackbox:
    profiles: [monitoring]
    image: prom/blackbox-exporter:v0.25.0@sha256:b04a9fef4fa086a02fc7fcd8dcdbc4b7b35cc30cdee860fdc6a19dd8b208d63e
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./infra/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [internal]

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.3.1@sha256:fa801ab6e1ae035135309580891e09f7eb94d1abdbd2106bdc288030b028158c
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${P1_GRAFANA_PASSWORD:?set P1_GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus]
    networks: [internal]

  # ------------------------------------------------------------- ops profile (self-hosted)
  # GlitchTip: error tracking that speaks the Sentry protocol. Set P1_SENTRY_DSN to the DSN of
  # the project you create in it. Its own small database keeps it apart from the app's data.
  glitchtip-db:
    profiles: [ops]
    image: postgres:16.6-alpine@sha256:1d04b9ba1d4996401f2552b51beda8187f175c0645c091e4781134fc9c9a3eef
    restart: unless-stopped
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${P1_GLITCHTIP_DB_PASSWORD:-glitchtip-dev}
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtipdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  glitchtip-migrate:
    profiles: [ops]
    image: glitchtip/glitchtip:v4.2.10@sha256:41c4c0ac813eda1c605c30ce55d72c09f4d427f30f795db1de3def43c4977c7a
    restart: "no"
    command: ["./bin/run-migrate.sh"]
    environment: &glitchtip-env
      DATABASE_URL: postgres://glitchtip:${P1_GLITCHTIP_DB_PASSWORD:-glitchtip-dev}@glitchtip-db:5432/glitchtip
      SECRET_KEY: ${P1_GLITCHTIP_SECRET_KEY:-glitchtip-dev-secret-change-me}
      REDIS_URL: redis://:${P1_REDIS_PASSWORD}@redis:6379/5
      GLITCHTIP_DOMAIN: ${P1_GLITCHTIP_DOMAIN:-http://localhost:9608}
      DEFAULT_FROM_EMAIL: ${P1_SMTP_FROM:-no-reply@itcraft.example}
      EMAIL_URL: ${P1_GLITCHTIP_EMAIL_URL:-consolemail://}
      ENABLE_USER_REGISTRATION: "false"
      ENABLE_ORGANIZATION_CREATION: "false"
      GLITCHTIP_MAX_EVENT_LIFE_DAYS: "90"
      PORT: "8000"
    depends_on:
      glitchtip-db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [internal]

  glitchtip:
    profiles: [ops]
    image: glitchtip/glitchtip:v4.2.10@sha256:41c4c0ac813eda1c605c30ce55d72c09f4d427f30f795db1de3def43c4977c7a
    restart: unless-stopped
    environment: *glitchtip-env
    depends_on:
      glitchtip-migrate: {condition: service_completed_successfully}
    deploy:
      resources:
        limits: {memory: 768m}
    networks: [internal]

  glitchtip-worker:
    profiles: [ops]
    image: glitchtip/glitchtip:v4.2.10@sha256:41c4c0ac813eda1c605c30ce55d72c09f4d427f30f795db1de3def43c4977c7a
    restart: unless-stopped
    command: ["./bin/run-celery-with-beat.sh"]
    environment: *glitchtip-env
    depends_on:
      glitchtip-migrate: {condition: service_completed_successfully}
    networks: [internal]

  # Uptime Kuma: checks /healthz and /readyz every minute and alerts by Telegram, ntfy or email.
  uptime-kuma:
    profiles: [ops]
    image: louislam/uptime-kuma:1.23.16@sha256:431fee3be822b04861cf0e35daf4beef6b7cb37391c5f26c3ad6e12ce280fe18
    restart: unless-stopped
    volumes:
      - uptimedata:/app/data
    networks: [internal]

  # --------------------------------------------------------------- mlflow profile (optional)
  # Experiment tracking for the learning module (ADR 0029). Off unless P1_MLFLOW_TRACKING_URI is
  # http://mlflow:5000; the app logs to it over the REST API and keeps its own record anyway.
  mlflow:
    profiles: [mlflow]
    image: ghcr.io/mlflow/mlflow:v2.18.0@sha256:09d25b0c80efa2c1dd4b5e4834a1a0ed861d6b1c2b43017ff99493bd5c6bb4ee
    restart: unless-stopped
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --default-artifact-root=/mlflow/artifacts
    volumes:
      - mlflowdata:/mlflow
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  redisdata:
  miniodata:
  clamdata:
  promdata:
  grafanadata:
  alertdata:
  glitchtipdb:
  uptimedata:
  mlflowdata:
