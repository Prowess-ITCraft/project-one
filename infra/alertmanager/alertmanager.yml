# Alertmanager: where alerts go. Critical alerts reach a phone through ntfy (free and
# self-hostable; subscribe to the topic in the ntfy app) and the on-call email; warnings go by
# email. Change the three lines marked EDIT for your server (docs/runbooks/alerts.md).
global:
  smtp_smarthost: "mailpit:1025" # EDIT: your SMTP server, for example smtp.example.com:587
  smtp_from: "alerts@itcraft.example"
  smtp_require_tls: false
route:
  receiver: email
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: phone-and-email
receivers:
  - name: email
    email_configs:
      - to: "it@itcraft.net.in" # EDIT: the on-call address
        send_resolved: true
  - name: phone-and-email
    email_configs:
      - to: "it@itcraft.net.in"
        send_resolved: true
    webhook_configs:
      # ntfy turns an Alertmanager message into a phone notification with template=alertmanager.
      - url: "https://ntfy.sh/project-one-alerts-change-me?template=alertmanager" # EDIT: your topic
        send_resolved: true
