worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  client_max_body_size 52m;
  client_body_timeout 30s;
  gzip on;
  gzip_types application/json text/css application/javascript text/plain;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # Per address. A whole office shares one public address, so these only stop floods; the API
  # rate-limits each person and locks accounts after failed sign-ins (core/ratelimit.py).
  limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;
  # "Slow down", not "server down": 503 made a busy minute look like an outage.
  limit_req_status 429;
  log_format json escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"rid":"$request_id"}';
  access_log /dev/stdout json;

  include /etc/nginx/conf.d/*.conf;
}
