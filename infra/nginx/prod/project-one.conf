# Production. Certificates live in infra/nginx/tls (mounted at /etc/letsencrypt), either from
# certbot (`--cert-name project-one`) or copied in by hand to the same paths. See
# docs/runbooks/deploy.md.

# Port 80: certbot's challenge, everything else moves to HTTPS.
server {
  listen 80;
  server_name _;
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

# Port 8080 (published as 9597): plain HTTP for a front load balancer, if there is one.
server {
  listen 8080;
  server_name _;
  include /etc/nginx/snippets/app.conf;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate /etc/letsencrypt/live/project-one/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/project-one/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000" always;
  include /etc/nginx/snippets/app.conf;
}
