# Plain HTTP: development, or production behind a load balancer that terminates TLS
# (P1_PROXY_CONF=conf.d; the load balancer forwards to 9597, which is 8080 here).
# Production with its own certificate uses infra/nginx/prod instead (docker-compose.prod.yml).
server {
  listen 80;
  listen 8080;
  server_name _;
  include /etc/nginx/snippets/app.conf;
}
