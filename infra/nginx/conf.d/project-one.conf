# Plain HTTP server. TLS is terminated either by a front load balancer (forward to port 9597)
# or by adding a 443 server block that reuses these locations; see docs/runbooks/deploy.md.
server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=10s;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;

  # Metrics are for Prometheus on the internal network only.
  location = /metrics { return 404; }

  location /api/v1/auth/ {
    limit_req zone=auth burst=10 nodelay;
    set $api http://api:9596;
    proxy_pass $api;
  }

  location ~ ^/(api/|docs|healthz|readyz) {
    limit_req zone=general burst=40 nodelay;
    set $api http://api:9596;
    proxy_pass $api;
    proxy_read_timeout 60s;
  }

  location /ws {
    set $api http://api:9596;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  # Everything else is the web app.
  location / {
    set $web http://web:9595;
    proxy_pass $web;
  }
}
