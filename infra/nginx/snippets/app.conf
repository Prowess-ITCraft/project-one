# The app's routes and headers, shared by the plain HTTP server (development, or behind a load
# balancer) and the HTTPS server in production. Included inside a `server` block.
resolver 127.0.0.11 valid=10s;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Check-in records where the engineer is, so location is allowed for this site only. Photos come
# through the file input with `capture`; the camera is allowed for this site only as well.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;

# Metrics are for Prometheus on the internal network only.
location = /metrics { return 404; }

# Only the requests that check a password or a code. /auth/me and the token refresh run on
# every page and fall under the general limit below.
location ~ ^/api/v1/auth/(login|token|mfa/) {
  limit_req zone=auth burst=30 nodelay;
  set $api http://api:9596;
  proxy_pass $api;
}

location ~ ^/(api/|docs|healthz|readyz) {
  limit_req zone=general burst=120 nodelay;
  set $api http://api:9596;
  proxy_pass $api;
  proxy_read_timeout 60s;
}

location /ws {
  set $api http://api:9596;
  proxy_pass $api;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 3600s;
}

# Everything else is the web app.
location / {
  set $web http://web:9595;
  proxy_pass $web;
}
