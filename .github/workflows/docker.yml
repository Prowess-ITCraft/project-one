name: docker
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t project-one/backend:ci backend
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: project-one/backend:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: anchore/sbom-action@v0
        with:
          image: project-one/backend:ci
          artifact-name: sbom.spdx.json
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Write a throwaway .env
        run: |
          cp .env.example .env
          for k in P1_POSTGRES_PASSWORD P1_OWNER_PASSWORD P1_APP_PASSWORD P1_REDIS_PASSWORD P1_S3_ACCESS_KEY P1_S3_SECRET_KEY P1_GRAFANA_PASSWORD P1_JWT_SIGNING_KEYS; do
            sed -i "s|^$k=.*|$k=$(openssl rand -hex 16)|" .env
          done
          sed -i "s|^P1_FERNET_KEYS=.*|P1_FERNET_KEYS=$(python3 -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')|" .env
      - run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build --wait --wait-timeout 420
      - run: curl -fsS http://127.0.0.1:9597/healthz
      - run: curl -fsS http://127.0.0.1:9597/readyz
      - if: failure()
        run: docker compose logs --tail=200
