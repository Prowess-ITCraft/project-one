# Production. The host publishes only 443 (HTTPS) and 80 (certificate challenge and a redirect to
# HTTPS), both handled by the reverse proxy (ADR 0030). Web, API, database, cache, storage,
# monitoring and Celery stay on the internal network; Grafana, Prometheus, GlitchTip and Uptime
# Kuma are reached over the admin VPN (Tailscale or WireGuard) or an SSH tunnel.
#
# Behind a load balancer that terminates TLS, add docker-compose.lb.yml: it publishes plain HTTP
# on 9597 for the load balancer only.
#
# Certificates: infra/nginx/tls holds them, laid out as certbot does
# (live/project-one/fullchain.pem and privkey.pem). docs/runbooks/deploy.md has both ways in:
# Let's Encrypt with the certbot service below, or your own certificate files.
#
# Secrets: set real values in .env (never commit it) or switch each P1_* variable to a Docker
# secret file; the app reads /run/secrets/<name> as well as environment variables.

services:
  proxy:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # `prod` serves HTTPS with the certificate below; `conf.d` is plain HTTP for when a front
      # load balancer terminates TLS (set P1_PROXY_CONF=conf.d in .env).
      - ./infra/nginx/${P1_PROXY_CONF:-prod}:/etc/nginx/conf.d:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
      - ./infra/nginx/tls:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # Reload every six hours so a renewed certificate is picked up without a restart.
    command: ["/bin/sh", "-c", "while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    # 8080 is internal in both proxy configurations (published only with docker-compose.lb.yml).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Renews the Let's Encrypt certificate twice a day (only acts when it is near expiry).
  # Not needed when you bring your own certificate files.
  certbot:
    profiles: [tls]
    image: certbot/certbot:v3.0.1@sha256:4d8875e85a2af373262914e15c0a149e1985c5bbd05ac433fe4763f465020fcf
    restart: unless-stopped
    volumes:
      - ./infra/nginx/tls:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    # Unhealthy when the certificate is missing or has less than 14 days left: renewal is failing.
    healthcheck:
      test: ["CMD", "python", "-c", "import datetime as d, sys; from cryptography import x509; c = x509.load_pem_x509_certificate(open('/etc/letsencrypt/live/project-one/fullchain.pem', 'rb').read()); sys.exit(c.not_valid_after_utc < d.datetime.now(d.timezone.utc) + d.timedelta(days=14))"]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 1m

  api:
    environment:
      P1_ENV: prod
      P1_COOKIE_SECURE: "true"
      # Empty: files are served through the app on its own address (MinIO stays internal).
      P1_S3_PUBLIC_ENDPOINT_URL: ${P1_S3_PUBLIC_ENDPOINT_URL:-}
    deploy:
      resources:
        limits: {memory: 2g}
  worker:
    environment:
      P1_ENV: prod
      P1_S3_PUBLIC_ENDPOINT_URL: ${P1_S3_PUBLIC_ENDPOINT_URL:-}
  beat:
    environment:
      P1_ENV: prod
      P1_S3_PUBLIC_ENDPOINT_URL: ${P1_S3_PUBLIC_ENDPOINT_URL:-}
  migrate:
    environment:
      P1_ENV: prod
      P1_S3_PUBLIC_ENDPOINT_URL: ${P1_S3_PUBLIC_ENDPOINT_URL:-}
  # api and web have their healthchecks in their Dockerfiles; uptime-kuma in its image.
  minio:
    healthcheck:
      test: ["CMD-SHELL", "MC_HOST_local=http://127.0.0.1:9000 mc ready local --quiet"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  prometheus:
    healthcheck: &wget-health
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  alertmanager:
    healthcheck:
      <<: *wget-health
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9093/-/healthy"]
  blackbox:
    healthcheck:
      <<: *wget-health
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9115/-/healthy"]

  # Only with --profile monitoring. Published on this server's own loopback address, so it is
  # reached through an SSH tunnel (DEPLOYMENT.md, section 10), never from the internet.
  grafana:
    ports: ["127.0.0.1:9604:3000"]
    healthcheck:
      <<: *wget-health
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]

  # Admin tools on this server's loopback only: reached over the VPN or an SSH tunnel.
  uptime-kuma:
    ports: ["127.0.0.1:9607:3001"]
  mlflow:
    ports: ["127.0.0.1:9606:5000"]
    healthcheck: &python-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  glitchtip:
    ports: ["127.0.0.1:9608:8000"]
    environment:
      GLITCHTIP_DOMAIN: ${P1_GLITCHTIP_DOMAIN:-http://localhost:9608}
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/_health/', timeout=4)"]
  glitchtip-worker:
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import sys; sys.exit(b'celery' not in open('/proc/1/cmdline', 'rb').read())"]

  # The disk and memory alerts watch the server itself, not the container.
  node-exporter:
    healthcheck:
      <<: *wget-health
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9100/metrics"]
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave

volumes:
  certbot-www:
